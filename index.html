<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Bangla Movie - Admin & Streaming Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white font-sans">

    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-red-500 flex items-center gap-2">
                <i class="fa-solid fa-film"></i> BD Bangla Movie
            </h1>
            <button onclick="toggleAdminPanel()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-sm font-semibold transition">
                <i class="fa-solid fa-lock"></i> অ্যাডমিন প্যানেল
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left/Main Section: Video Player & List -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Video Player Box -->
            <div class="bg-gray-800 rounded-lg overflow-hidden shadow-lg border border-gray-700">
                <div class="relative aspect-video bg-black flex items-center justify-center" id="player-container">
                    <video id="main-video-player" controls class="w-full h-full object-contain" poster="">
                        আপনার ব্রাউজার ভিডিও ট্যাগ সমর্থন করে না।
                    </video>
                </div>
                <div class="p-4 space-y-3">
                    <h2 id="current-video-title" class="text-xl font-bold text-yellow-400">দয়া করে একটি মুভি বা ভিডিও সিলেক্ট করুন</h2>
                    <div class="flex flex-wrap items-center justify-between text-sm text-gray-400 border-b border-gray-700 pb-3">
                        <span id="current-video-views"><i class="fa-solid fa-eye"></i> ভিউ: ০</span>
                        <div class="flex items-center gap-4">
                            <button onclick="likeVideo()" class="hover:text-red-500 transition flex items-center gap-1">
                                <i class="fa-solid fa-heart text-red-500"></i> <span id="current-video-likes">০</span> পছন্দ
                            </button>
                            <div class="flex items-center text-yellow-400" id="star-rating-display">
                                <i class="fa-solid fa-star"></i> <span id="current-video-rating">০.০</span>/৫
                            </div>
                        </div>
                    </div>
                    <!-- Rate Video Section -->
                    <div class="flex items-center gap-2 pt-1 text-sm">
                        <span>রেটিং দিন:</span>
                        <div class="flex gap-1 cursor-pointer text-gray-500" id="rating-stars">
                            <i class="fa-solid fa-star hover:text-yellow-400" onclick="rateVideo(1)"></i>
                            <i class="fa-solid fa-star hover:text-yellow-400" onclick="rateVideo(2)"></i>
                            <i class="fa-solid fa-star hover:text-yellow-400" onclick="rateVideo(3)"></i>
                            <i class="fa-solid fa-star hover:text-yellow-400" onclick="rateVideo(4)"></i>
                            <i class="fa-solid fa-star hover:text-yellow-400" onclick="rateVideo(5)"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Movie Catalog / List -->
            <div>
                <h3 class="text-lg font-semibold mb-4 border-l-4 border-red-500 pl-2">সকল মুভি ও সিরিজ (সিরিয়াল অনুযায়ী)</h3>
                <div id="movie-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Dynamic Movies will load here -->
                </div>
            </div>
        </div>

        <!-- Right Section: Admin Upload Panel (Hidden by default) -->
        <div id="admin-panel" class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-lg h-fit hidden">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                <h3 class="font-bold text-red-400 flex items-center gap-2"><i class="fa-solid fa-upload"></i> ভিডিও আপলোড প্যানেল</h3>
                <button onclick="toggleAdminPanel()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="upload-form" onsubmit="handleUpload(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1">সিরিয়াল নম্বর / পর্ব:</label>
                    <input type="number" id="movie-serial" required placeholder="যেমন: 1, 2, 3..." class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">মুভি বা সিরিজের নাম:</label>
                    <input type="text" id="movie-title" required placeholder="যেমন: তুফান (Full HD)" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">ভিডিও ফাইল লিঙ্ক (MP4 Direct URL):</label>
                    <input type="url" id="movie-url" required placeholder="Google Drive, Dropbox বা Direct MP4 link" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-red-500">
                    <p class="text-[10px] text-gray-400 mt-1">টিপস: ভিডিওর ডিরেক্ট এমপিফোর (.mp4) বা ক্লাউড লিংক ব্যবহার করুন।</p>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">থাম্বনেল ছবির লিঙ্ক (Thumbnail URL):</label>
                    <input type="url" id="movie-thumb" required placeholder="ছবির ডিরেক্ট ইমেজ লিংক দিন" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-red-500">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 py-2 rounded font-bold text-sm transition">
                    আপলোড করুন
                </button>
            </form>
            <div class="mt-4 pt-4 border-t border-gray-700 text-center">
                <button onclick="clearAllMovies()" class="text-xs text-red-400 hover:underline">সব ডাটা রিসেট/মুছে ফেলুন</button>
            </div>
        </div>

    </div>

    <!-- JavaScript Core Logic -->
    <script>
        // LocalStorage থেকে মুভি ডাটা লোড করা (না থাকলে ডিফল্ট ডেমো ডাটা থাকবে)
        let movies = JSON.parse(localStorage.getItem('bd_movies')) || [
            {
                id: 1,
                serial: 1,
                title: "তুফান - মেগা ব্লকবাস্টার শাকিব খান",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4", // ডেমো ভিডিও লিংক
                thumbUrl: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500",
                views: 1250,
                likes: 340,
                rating: 4.8,
                ratingCount: 50
            }
        ];

        let currentPlayingId = null;

        // অ্যাডমিন প্যানেল টগল করার ফাংশন
        function toggleAdminPanel() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
        }

        // মুভি রেন্ডার করার ফাংশন
        function renderMovies() {
            const listContainer = document.getElementById('movie-list');
            listContainer.innerHTML = '';

            // সিরিয়াল অনুযায়ী সাজানো (Sorting by serial)
            movies.sort((a, b) => a.serial - b.serial);

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = "bg-gray-800 rounded-lg overflow-hidden border border-gray-700 hover:border-red-500 transition flex flex-col justify-between";
                card.innerHTML = `
                    <div class="relative cursor-pointer" onclick="playMovie(${movie.id})">
                        <img src="${movie.thumbUrl}" alt="${movie.title}" class="w-full h-36 object-cover">
                        <span class="absolute top-2 left-2 bg-red-600 text-xs px-2 py-0.5 rounded font-bold">পর্ব #${movie.serial}</span>
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100 transition">
                            <i class="fa-solid fa-circle-play text-4xl text-red-500"></i>
                        </div>
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-grow">
                        <div>
                            <h4 class="font-semibold text-sm line-clamp-2 cursor-pointer hover:text-red-400" onclick="playMovie(${movie.id})">${movie.title}</h4>
                        </div>
                        <div class="flex items-center justify-between text-xs text-gray-400 mt-3 pt-2 border-t border-gray-700">
                            <span><i class="fa-solid fa-eye"></i> ${movie.views} ভিউ</span>
                            <span><i class="fa-solid fa-star text-yellow-400"></i> ${movie.rating} (${movie.ratingCount})</span>
                            <button onclick="deleteMovie(${movie.id})" class="text-red-500 hover:text-red-400" title="মুছে ফেলুন"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            // সেভ করে রাখা
            localStorage.setItem('bd_movies', JSON.stringify(movies));
        }

        // মুভি প্লে করার ফাংশন এবং ভিউ কাউন্ট বাড়ানো
        function playMovie(id) {
            const movie = movies.find(m => m.id === id);
            if (!movie) return;

            currentPlayingId = id;
            movie.views += 1; // ভিউ বাড়বে
            localStorage.setItem('bd_movies', JSON.stringify(movies));

            const player = document.getElementById('main-video-player');
            player.src = movie.videoUrl;
            player.poster = movie.thumbUrl;
            player.play();

            document.getElementById('current-video-title').innerText = `পর্ব #${movie.serial}: ${movie.title}`;
            document.getElementById('current-video-views').innerHTML = `<i class="fa-solid fa-eye"></i> ভিউ: ${movie.views}`;
            document.getElementById('current-video-likes').innerText = movie.likes;
            document.getElementById('current-video-rating').innerText = movie.rating;

            // পেজ স্ক্রোল করে উপরে প্লেয়ারে চলে যাওয়া
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderMovies();
        }

        // নতুন মুভি আপলোড হ্যান্ডলার
        function handleUpload(event) {
            event.preventDefault();

            const serial = parseInt(document.getElementById('movie-serial').value);
            const title = document.getElementById('movie-title').value;
            const videoUrl = document.getElementById('movie-url').value;
            const thumbUrl = document.getElementById('movie-thumb').value;

            const newMovie = {
                id: Date.now(),
                serial: serial,
                title: title,
                videoUrl: videoUrl,
                thumbUrl: thumbUrl,
                views: 0,
                likes: 0,
                rating: 0.0,
                ratingCount: 0
            };

            movies.push(newMovie);
            localStorage.setItem('bd_movies', JSON.stringify(movies));
            renderMovies();

            // ফর্ম রিসেট
            document.getElementById('upload-form').reset();
            alert('সফলভাবে মুভি আপলোড হয়েছে!');
            toggleAdminPanel();
        }

        // লাইক বাড়ানোর ফাংশন
        function likeVideo() {
            if (!currentPlayingId) {
                alert('প্রথমে একটি ভিডিও চালু করুন!');
                return;
            }
            const movie = movies.find(m => m.id === currentPlayingId);
            if (movie) {
                movie.likes += 1;
                localStorage.setItem('bd_movies', JSON.stringify(movies));
                document.getElementById('current-video-likes').innerText = movie.likes;
            }
        }

        // স্টার রেটিং দেওয়ার ফাংশন
        function rateVideo(stars) {
            if (!currentPlayingId) {
                alert('প্রথমে একটি ভিডিও চালু করুন!');
                return;
            }
            const movie = movies.find(m => m.id === currentPlayingId);
            if (movie) {
                const totalScore = (movie.rating * movie.ratingCount) + stars;
                movie.ratingCount += 1;
                movie.rating = (totalScore / movie.ratingCount).toFixed(1);
                localStorage.setItem('bd_movies', JSON.stringify(movies));
                document.getElementById('current-video-rating').innerText = movie.rating;
                alert(`ধন্যবাদ! আপনি ${stars} স্টার রেটিং দিয়েছেন।`);
            }
        }

        // মুভি ডিলিট করার ফাংশন
        function deleteMovie(id) {
            if (confirm('আপনি কি নিশ্চিতভাবে এই মুভিটি ডিলিট করতে চান?')) {
                movies = movies.filter(m => m.id !== id);
                localStorage.setItem('bd_movies', JSON.stringify(movies));
                renderMovies();
            }
        }

        // সব ডাটা রিসেট
        function clearAllMovies() {
            if (confirm('সব মুভি মুছে ফেলতে চান?')) {
                localStorage.removeItem('bd_movies');
                movies = [];
                renderMovies();
            }
        }

        // পেজ লোড হওয়ার পর মুভি লিস্ট রেন্ডার করা
        window.onload = function() {
            renderMovies();
        };
    </script>
</body>
</html>
